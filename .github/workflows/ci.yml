name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run cdn
      - name: cdn/ must match the source
        run: |
          if ! git diff --quiet -- cdn; then
            echo "cdn/ is out of date. Run 'npm run cdn' and commit the result." >&2
            git diff --stat -- cdn
            exit 1
          fi
